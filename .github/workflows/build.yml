name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Cometsnap.sln -c Release
      - name: Test
        run: dotnet test Cometsnap.sln -c Release --no-build --logger "console;verbosity=normal"

  publish:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish portable Cometsnap.exe (${{ matrix.arch }})
        shell: pwsh
        run: |
          $version = "0.1.0"
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}".TrimStart("v") }
          dotnet publish src/Cometsnap.App/Cometsnap.App.csproj -c Release -r win-${{ matrix.arch }} `
            -p:Version=$version -o out/${{ matrix.arch }}
          Get-ChildItem out/${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Cometsnap-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/Cometsnap.exe
          if-no-files-found: error

  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Rename binaries
        run: |
          mkdir -p rel
          cp dl/Cometsnap-x64/Cometsnap.exe rel/Cometsnap-x64.exe
          cp dl/Cometsnap-arm64/Cometsnap.exe rel/Cometsnap-arm64.exe
          ls -la rel
      - name: Update the "latest build" pre-release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly rel/*.exe --prerelease --target "${{ github.sha }}" \
            --title "Latest build (main)" \
            --notes "Automatic build of the latest commit on main (${GITHUB_SHA::7}). Portable: download the exe for your PC (x64 for most PCs, arm64 for Snapdragon / Surface Pro X) and run it."
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" rel/*.exe --title "Cometsnap ${{ github.ref_name }}" --generate-notes
