name: macos

on:
  push:
    branches: [main]
    paths: ['macos/**', 'assets/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', 'assets/**', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Compile (universal)
        run: |
          set -o pipefail
          if ! swift build -c release --arch arm64 --arch x86_64 2>&1 | tee build.log; then
            # Surface compiler errors as annotations on the run.
            grep -E '^/.+\.swift:[0-9]+:[0-9]+: error: ' build.log | sort -u | head -45 | while IFS= read -r line; do
              file="${line%%:*}"; rest="${line#*:}"; ln="${rest%%:*}"; msg="${line#*: error: }"
              echo "::error file=${file#$GITHUB_WORKSPACE/},line=${ln}::${msg}"
            done
            exit 1
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          if ! swift test 2>&1 | tee test.log | tail -40; then
            grep -E 'error: |: failed' test.log | sort -u | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      # Optional signing: add these repository secrets to turn it on (see macos/SIGNING.md).
      #   MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD, and for notarization
      #   NOTARY_KEY_P8 (base64 .p8), NOTARY_KEY_ID, NOTARY_ISSUER.
      # Pull requests from forks never see secrets and fall back to ad-hoc signing.
      - name: Import the signing certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPASS="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -v -p codesigning "$KC" | sed -nE 's/.*"(.+)"$/\1/p' | head -1)"
          [ -n "$ID" ] || { echo "::error::No code signing identity in MACOS_CERT_P12"; exit 1; }
          echo "Signing as: $ID"
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_KEY_P8" ]; then
            echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            { echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"; echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"; echo "NOTARY_ISSUER=$NOTARY_ISSUER"; } >> "$GITHUB_ENV"
          fi

      - name: Bundle .app, .dmg and .zip
        run: |
          VERSION="0.1.0"
          scripts/make-app.sh "$VERSION" "${{ github.run_number }}"

      - name: Update the macOS "latest build" pre-release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete macos-nightly --yes --cleanup-tag || true
          gh release create macos-nightly build/Cometsnap-macOS.dmg build/Cometsnap-macOS.zip \
            --prerelease --latest=false --target "${{ github.sha }}" \
            --title "Latest macOS build (main)" --notes-file FIRST-LAUNCH.txt

      - name: Update the macOS test pre-release of this pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh release delete "macos-test-pr$PR" --yes --cleanup-tag || true
          {
            echo "macOS test build of pull request #$PR (commit ${HEAD_SHA::7}). One universal app for Apple Silicon and Intel, macOS 14 Sonoma or newer."
            echo
            cat FIRST-LAUNCH.txt
          } > notes.txt
          gh release create "macos-test-pr$PR" build/Cometsnap-macOS.dmg build/Cometsnap-macOS.zip \
            --prerelease --latest=false --target "$HEAD_SHA" \
            --title "macOS test build: PR #$PR" --notes-file notes.txt
